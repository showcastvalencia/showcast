<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla principal — Megadraft Showcast</title>
<link rel="stylesheet" href="megadraft.css">
</head>
<body>

<header class="md-header">
  <a href="index.html" class="logo">
    <img src="../assets/logo.png" alt="Logo Showcast">
    <span>SHOWCAST <span class="tag">Megadraft</span></span>
  </a>
  <nav>
    <a href="draft.html">Soy capitán</a>
  </nav>
</header>

<div class="wrap">
  <div class="timers-row" id="timersRow">
    <div class="timer-card" id="prepTimerCard">
      <div class="tc-label">Preparación</div>
      <div class="tc-value" id="prepTimerValue">00:00</div>
    </div>
    <div class="timer-card" id="pickTimerCard">
      <div class="tc-label" id="pickTimerLabel">Tiempo de elección</div>
      <div class="tc-value" id="pickTimerValue">00:00</div>
    </div>
  </div>

  <div class="turn-banner" id="turnBanner">
    <div class="round" id="roundLabel">Esperando…</div>
    <div class="team-name" id="turnTeamLabel">—</div>
  </div>

  <h2 style="margin-bottom:14px;">Pool de personajes</h2>
  <div class="pool-grid" id="poolGrid"></div>

  <h2 style="margin:34px 0 6px;">Equipos</h2>
  <div class="teams-grid" id="teamsGrid"></div>
</div>

<!-- FICHA DE JUGADOR: se abre al pulsar el nombre de un miembro -->
<div class="player-modal-overlay" id="playerCardOverlay">
  <div class="player-modal-card">
    <button type="button" class="player-modal-close" id="playerCardClose">✕</button>
    <div id="playerCardEmpty" class="player-modal-empty" style="display:none;">
      Este miembro todavía no tiene un tag de Brawl Stars comprobado.
    </div>
    <div id="playerCardBody" style="display:none;">
      <div class="player-preview">
        <img id="pc-icon" class="player-icon" src="" alt="Icono de jugador">
        <div>
          <h3 id="pc-name">—</h3>
          <span id="pc-tag" class="player-tag">#000000</span>
        </div>
      </div>
      <div class="player-stats">
        <div class="stat-box"><span class="stat-num" id="pc-trophies">0</span><span class="stat-label">Trofeos</span></div>
        <div class="stat-box"><span class="stat-num" id="pc-v3v3">0</span><span class="stat-label">Victorias 3v3</span></div>
        <div class="stat-box"><span class="stat-num" id="pc-elo">0</span><span class="stat-label">Elo máx. ranked</span></div>
      </div>
      <p id="pc-rank-name" style="text-align:center;opacity:.75;font-size:.85rem;margin-bottom:12px;"></p>
      <div class="player-total-score">
        <span>Puntuación</span>
        <span id="pc-score">0</span>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/draft-logic.js"></script>
<script>
  const playerCardOverlay = document.getElementById('playerCardOverlay');
  const playerCardEmpty = document.getElementById('playerCardEmpty');
  const playerCardBody = document.getElementById('playerCardBody');

  function openPlayerCard(member){
    playerCardOverlay.classList.add('open');
    if(!member || !member.tag){
      playerCardEmpty.style.display = 'block';
      playerCardBody.style.display = 'none';
      return;
    }
    playerCardEmpty.style.display = 'none';
    playerCardBody.style.display = 'block';
    document.getElementById('pc-icon').src = member.iconUrl || '';
    document.getElementById('pc-name').textContent = member.nombre || '(sin nombre)';
    document.getElementById('pc-tag').textContent = member.tag;
    document.getElementById('pc-trophies').textContent = member.trophies || 0;
    document.getElementById('pc-v3v3').textContent = member.victories3v3 || 0;
    document.getElementById('pc-elo').textContent = member.rankedAllTimePeakElo || 0;
    document.getElementById('pc-rank-name').textContent = member.rankedAllTimePeakName
      ? ('Máximo ranked (histórico): ' + member.rankedAllTimePeakName) : '';
    document.getElementById('pc-score').textContent = MD.calcMemberScore(member);
  }
  document.getElementById('playerCardClose').addEventListener('click', () => playerCardOverlay.classList.remove('open'));
  playerCardOverlay.addEventListener('click', e => { if(e.target === playerCardOverlay) playerCardOverlay.classList.remove('open'); });

  const poolGrid = document.getElementById('poolGrid');
  const teamsGrid = document.getElementById('teamsGrid');
  const turnTeamLabel = document.getElementById('turnTeamLabel');
  const roundLabel = document.getElementById('roundLabel');

  let brawlers = [];
  let brawlersById = {};
  let latestState = null;

  setInterval(() => {
    const timers = (latestState && latestState.timers) || {};
    const prepRemaining = MD.timerRemaining(timers.prep);
    const prepValue = document.getElementById('prepTimerValue');
    prepValue.textContent = MD.formatTime(prepRemaining);
    prepValue.classList.toggle('low', prepRemaining > 0 && prepRemaining <= 5);
    document.getElementById('prepTimerCard').classList.toggle('paused', !(timers.prep && timers.prep.running));

    const pick = timers.pick;
    const pickRemaining = MD.timerRemaining(pick);
    const pickValue = document.getElementById('pickTimerValue');
    pickValue.textContent = MD.formatTime(pickRemaining);
    pickValue.classList.toggle('low', pickRemaining > 0 && pickRemaining <= 5);
    document.getElementById('pickTimerCard').classList.toggle('paused', !(pick && pick.running));
    const pickLabel = document.getElementById('pickTimerLabel');
    if(pick && pick.currentTeamId && latestState.teams){
      const team = latestState.teams[pick.currentTeamId];
      pickLabel.textContent = 'Elección: ' + ((team && team.name) || pick.currentTeamId);
    } else {
      pickLabel.textContent = 'Tiempo de elección';
    }
  }, 500);

  MD.loadBrawlers().then(list => {
    brawlers = list;
    brawlersById = Object.fromEntries(list.map(b => [b.id, b]));
    MD.subscribeState(state => { latestState = state; render(state); });
  });

  function render(state){
    if(!state || !state.teams){
      roundLabel.textContent = 'Sala sin configurar';
      turnTeamLabel.textContent = 'Esperando al organizador…';
      return;
    }

    if(state.status === 'config'){
      roundLabel.textContent = 'Antes de empezar';
      turnTeamLabel.textContent = 'Esperando a que el anfitrión inicie la fase de draft...';
    } else if(MD.isComplete(state)){
      roundLabel.textContent = 'Draft completado';
      turnTeamLabel.textContent = '¡Los 8 equipos tienen sus 12 personajes!';
    } else {
      const turnTeamId = MD.currentTurnTeamId(state);
      roundLabel.textContent = `Ronda ${MD.currentRound(state)} / ${MD.PICKS_PER_TEAM}`;
      turnTeamLabel.textContent = `Turno de: ${(state.teams[turnTeamId] && state.teams[turnTeamId].name) || '—'}`;
    }

    MD.renderPool(poolGrid, brawlers, state, {});
    MD.renderTeams(teamsGrid, state, brawlersById, { onMemberClick: openPlayerCard });
  }
</script>
</body>
</html>
