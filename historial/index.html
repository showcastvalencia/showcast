<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de partidas — Showcast</title>
<link rel="stylesheet" href="historial.css">
</head>
<body>

<header class="hd-header">
  <a href="../index.html" class="logo">
    <img src="../assets/logo.png" alt="Logo Showcast">
    <span>SHOWCAST <span class="tag">Historial de partidas</span></span>
  </a>
  <nav>
    <a href="../index.html">← Volver a la web</a>
  </nav>
</header>

<div class="wrap">
  <h1 style="margin-bottom:8px;">Historial de partidas</h1>
  <p class="hint" style="margin-bottom:26px;">
    Qué se jugó de verdad en cada partido: mapa, modo y los Brawlers que eligió cada equipo.
  </p>

  <div id="torneoSelector" class="field" style="max-width:360px;"></div>
  <div id="spinner" class="spinner"></div>
  <div id="contenido"></div>
</div>

<!-- VISOR DE PERFIL DE JUGADOR -->
<div class="pmodal-overlay" id="pmodalOverlay">
  <div class="pmodal-card" id="pmodalCard">
    <button type="button" class="pmodal-close" id="pmodalClose" aria-label="Cerrar">✕</button>

    <div id="pmodalLoading" class="pmodal-state">
      <div class="spinner"></div>
      <p>Buscando jugador...</p>
    </div>

    <div id="pmodalError" class="pmodal-state" style="display:none;">
      <div class="pmodal-error-icon">✕</div>
      <p id="pmodalErrorMsg">No se ha podido comprobar la cuenta.</p>
    </div>

    <div id="pmodalResult" style="display:none;">
      <div class="pmodal-preview">
        <img id="pm-icon" class="pmodal-icon" src="" alt="Icono de jugador">
        <div>
          <h3 id="pm-name">—</h3>
          <span id="pm-tag" class="pmodal-tag">#000000</span>
        </div>
        <div class="pmodal-prestige" title="Prestigio">
          <img src="../assets/prestigio.webp" alt="Prestigio">
          <span class="pmodal-prestige-num" id="pm-prestige">0</span>
        </div>
      </div>
      <div class="pmodal-stats">
        <div class="pmodal-stat-box">
          <span class="pmodal-stat-num" id="pm-trophies">0</span>
          <span class="pmodal-stat-label">Trofeos</span>
        </div>
        <div class="pmodal-stat-box">
          <span class="pmodal-stat-num" id="pm-v3v3">0</span>
          <span class="pmodal-stat-label">Victorias 3v3</span>
        </div>
        <div class="pmodal-stat-box">
          <span class="pmodal-stat-num" id="pm-rank" style="font-size:.95rem;">—</span>
          <span class="pmodal-stat-label">Máx. ranked (histórico)</span>
        </div>
      </div>
      <p class="pmodal-hint" id="pm-current-ranked"></p>
    </div>
  </div>
</div>

<script src="../content.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/historial-logic.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  let slugActual = params.get('torneo') || '';
  let torneoRef = null;
  let ultimaData = null;
  const matchesAbiertos = new Set();

  // Mapa nombre de Brawler (normalizado) -> icono, reutilizando los 106
  // iconos ya autoalojados para Megadraft (assets/brawlers.json) en vez de
  // depender de brawlify.com — ver ARQUITECTURA.md §15 (problema conocido).
  let brawlerIcons = {};
  function normalizeBrawlerName(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }
  fetch('../assets/brawlers.json').then(r => r.json()).then(list => {
    (list || []).forEach(b => { brawlerIcons[normalizeBrawlerName(b.name)] = b.icon; });
    if (ultimaData) pintarTorneo(ultimaData);
  }).catch(() => {});

  function brawlerLabel(b) {
    return b ? String(b) : '?';
  }

  function jugadorCardHtml(p) {
    // Un jugador puede llevar más de un Brawler (Duelo, cambia entre rondas) —
    // el icono muestra el primero, el texto de debajo los enseña todos.
    const primerBrawler = (p.brawler || '').split('/')[0];
    const icon = brawlerIcons[normalizeBrawlerName(primerBrawler)];
    const iconHtml = icon
      ? `<img src="${icon}" alt="" class="jugador-icon">`
      : `<div class="jugador-icon-fallback">${brawlerLabel(p.brawler)}</div>`;
    // Solo es clicable si el juego se procesó después de que se empezara a
    // guardar el tag del jugador (ver ARQUITECTURA.md §15) — sin tag no hay
    // forma de consultar su perfil.
    const clickable = p.tag ? ' jugador-card-clickable' : '';
    const dataTag = p.tag ? ` data-tag="${p.tag}"` : '';
    return `
      <div class="jugador-card${clickable}"${dataTag}>
        ${iconHtml}
        <span class="jugador-nombre">${p.jugador}</span>
        <span class="jugador-brawler">${brawlerLabel(p.brawler)}</span>
      </div>`;
  }

  function pintarJuegos(juegos) {
    if (!juegos || !juegos.length) {
      return '<p class="hint" style="padding:16px 20px;">Sin datos de Brawl Stars cruzados para este partido todavía.</p>';
    }
    return juegos.map(j => {
      // Degradado azul (ganador, más marcado) / rojo (perdedor, más tenue)
      // sobre todo el lado — sin marcar nada si hubo empate.
      const claseA = j.ganador === 'equipoA' ? ' ganador' : (j.ganador === 'equipoB' ? ' perdedor' : '');
      const claseB = j.ganador === 'equipoB' ? ' ganador' : (j.ganador === 'equipoA' ? ' perdedor' : '');
      return `
      <div class="juego-card">
        <div class="j-meta">
          Juego ${j.orden} — ${j.mapa || ''}${j.mapa && j.modo ? ' · ' : ''}${j.modo || ''}${j.duracion ? ` · ${j.duracion}s` : ''}
          ${j.ganador === 'empate' ? ' · Empate' : ''}
        </div>
        <div class="juego-vs-row">
          <div class="jugadores-lado${claseA}">${(j.picksEquipoA || []).map(jugadorCardHtml).join('')}</div>
          <img class="vs-badge" src="../assets/VS.png" alt="VS">
          <div class="jugadores-lado${claseB}">${(j.picksEquipoB || []).map(jugadorCardHtml).join('')}</div>
        </div>
      </div>`;
    }).join('');
  }

  function pintarMatch(m) {
    const ganador = m.resultadoChallonge && m.resultadoChallonge.ganador;
    const nombreA = (m.equipoA && m.equipoA.nombre) || '?';
    const nombreB = (m.equipoB && m.equipoB.nombre) || '?';
    const claseA = ganador && ganador === (m.equipoA && m.equipoA.participantId) ? 'winner' : '';
    const claseB = ganador && ganador === (m.equipoB && m.equipoB.participantId) ? 'winner' : '';
    const score = (m.resultadoChallonge && m.resultadoChallonge.scoresCsv) || '';
    const abierto = matchesAbiertos.has(String(m.challongeMatchId)) ? ' open' : '';
    return `
      <div class="match-card${abierto}" data-match-id="${m.challongeMatchId}">
        <button type="button" class="match-summary">
          <span class="m-teams">
            <span class="${claseA}">${nombreA}</span> vs <span class="${claseB}">${nombreB}</span>
          </span>
          <span class="m-score">${score}</span>
          <span class="m-chev"></span>
        </button>
        <div class="match-body"><div>${pintarJuegos(m.juegos)}</div></div>
      </div>`;
  }

  // Vuelve a pintar entero en cada cambio de Firebase — se conserva qué
  // partidos estaban desplegados (matchesAbiertos) para que una actualización
  // en vivo no cierre lo que la persona tenía abierto.
  function pintarTorneo(data) {
    ultimaData = data;
    const contenido = document.getElementById('contenido');
    const matches = Object.values(data.matches || {});
    if (!matches.length) {
      contenido.innerHTML = '<p class="empty-note">Todavía no hay partidos procesados en este torneo.</p>';
      return;
    }
    const porRonda = {};
    matches.forEach(m => {
      const r = m.ronda || 0;
      (porRonda[r] = porRonda[r] || []).push(m);
    });
    const rondas = Object.keys(porRonda).map(Number).sort((a, b) => a - b);
    contenido.innerHTML = rondas.map(r => `
      <div class="ronda-block">
        <h2>${r > 0 ? 'Ronda ' + r : 'Fase de grupos'}</h2>
        ${porRonda[r].map(pintarMatch).join('')}
      </div>
    `).join('');

    contenido.querySelectorAll('.match-card').forEach(card => {
      card.querySelector('.match-summary').addEventListener('click', () => {
        const abierto = card.classList.toggle('open');
        const id = card.dataset.matchId;
        if (abierto) matchesAbiertos.add(id); else matchesAbiertos.delete(id);
      });
    });
  }

  // VISOR DE PERFIL DE JUGADOR — mismo contenido que el modal "¿Es esta tu
  // cuenta?" de index.html, sin los botones de confirmación (aquí solo se
  // consulta, no se vincula ningún tag). Delegado sobre #contenido para que
  // funcione también con las tarjetas repintadas por la escucha en vivo.
  const pmodalOverlay = document.getElementById('pmodalOverlay');
  function pmodalShowState(state) {
    document.getElementById('pmodalLoading').style.display = state === 'loading' ? 'block' : 'none';
    document.getElementById('pmodalError').style.display = state === 'error' ? 'block' : 'none';
    document.getElementById('pmodalResult').style.display = state === 'result' ? 'block' : 'none';
  }
  function abrirPerfil(tag) {
    pmodalOverlay.classList.add('open');
    pmodalShowState('loading');
    HD.fetchPlayer(tag).then(body => {
      document.getElementById('pm-icon').src = body.iconUrl || '';
      document.getElementById('pm-name').textContent = body.name || '(sin nombre)';
      document.getElementById('pm-tag').textContent = body.tag || tag;
      document.getElementById('pm-prestige').textContent = body.prestige ?? 0;
      document.getElementById('pm-trophies').textContent = body.trophies ?? 0;
      document.getElementById('pm-v3v3').textContent = body.victories3v3 ?? 0;
      document.getElementById('pm-rank').textContent = body.rankedAllTimePeakName || '—';
      const currentEl = document.getElementById('pm-current-ranked');
      currentEl.textContent = body.rankedCurrentName
        ? 'Ranked actual: ' + body.rankedCurrentName
        : 'Este jugador todavía no tiene partidas de Ranked registradas.';
      pmodalShowState('result');
    }).catch(err => {
      document.getElementById('pmodalErrorMsg').textContent = err.message || 'No se ha podido comprobar la cuenta.';
      pmodalShowState('error');
    });
  }
  document.getElementById('contenido').addEventListener('click', e => {
    const card = e.target.closest('.jugador-card-clickable');
    if (card && card.dataset.tag) abrirPerfil(card.dataset.tag);
  });
  document.getElementById('pmodalClose').addEventListener('click', () => pmodalOverlay.classList.remove('open'));
  pmodalOverlay.addEventListener('click', e => {
    if (e.target === pmodalOverlay) pmodalOverlay.classList.remove('open');
  });

  // Escucha en tiempo real (no .once): quien tenga la pantalla abierta
  // durante el torneo ve los partidos nuevos aparecer solos, sin recargar.
  function cargar(slug) {
    if (torneoRef) torneoRef.off();
    matchesAbiertos.clear();
    document.getElementById('spinner').style.display = '';
    document.getElementById('contenido').innerHTML = '';

    torneoRef = db.ref('historial/' + slug);
    torneoRef.on('value', snap => {
      document.getElementById('spinner').style.display = 'none';
      const data = snap.val();
      if (!data) {
        document.getElementById('contenido').innerHTML = '<p class="empty-note">No existe ningún historial guardado con ese identificador.</p>';
        return;
      }
      pintarTorneo(data);
    });
  }

  db.ref('historial').once('value').then(snap => {
    const torneos = snap.val() || {};
    const slugs = Object.keys(torneos);
    const selector = document.getElementById('torneoSelector');

    if (!slugs.length) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('contenido').innerHTML = '<p class="empty-note">Todavía no hay ningún historial de partidos publicado.</p>';
      return;
    }

    if (!slugActual || !torneos[slugActual]) slugActual = slugs[slugs.length - 1];

    if (slugs.length > 1) {
      selector.innerHTML = `
        <label for="torneoSelect">Torneo</label>
        <select id="torneoSelect">
          ${slugs.map(s => `<option value="${s}" ${s === slugActual ? 'selected' : ''}>${(torneos[s].meta && torneos[s].meta.nombre) || s}</option>`).join('')}
        </select>`;
      document.getElementById('torneoSelect').addEventListener('change', e => cargar(e.target.value));
    }

    cargar(slugActual);
  });
</script>
</body>
</html>
